name: Chequeo diario del sitio

# El cron lo dispara GitHub, gratis, sin que tu PC esté encendido.
# "0 12 * * *" es todos los días a las 12:00 UTC = 08:00 o 09:00 en Chile
# según horario de verano. GitHub solo entiende UTC.
on:
  schedule:
    - cron: '0 12 * * *'
  # Además puedes dispararlo a mano desde la pestaña Actions del repositorio.
  workflow_dispatch:
  # Y en cada push a main, para pillar un despliegue que rompió algo.
  push:
    branches: [main]

jobs:
  chequeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Modo seguro: no manda correos, no crea leads, no gasta API de Claude.
      - name: Chequeo de todos los proyectos
        run: node checkup/run.mjs

      # El informe queda descargable desde la corrida, aunque el chequeo falle.
      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-estado-360
          path: checkup/reports/
          retention-days: 30
